name: Verify candidate publication
description: Check the published commons JAR and POM, then exercise them in the shaded plugin.
runs:
  using: composite
  steps:
    - name: Check out the downstream artifact-test fixture
      uses: actions/checkout@v7
      with:
        repository: CrimsonWarpedcraft/plugin-template
        ref: 9a8b00354cdeb7160657439661abd045c2971f77 # merged artifactTest (#466)
        path: template-fixture
        persist-credentials: false

    - name: Set up Python for archive and POM checks
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Publish, inspect and test the exact candidate
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $repo = Join-Path $env:RUNNER_TEMP ("cw-publication-" + [guid]::NewGuid())
        $version = "0.0.0-CI-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        $publish = @('publishToMavenLocal', "-Dmaven.repo.local=$repo", "-Pver=v$version", '--stacktrace')
        ./gradlew @publish
        ./gradlew @publish -I ci/jitpack-group.init.gradle
        python ci/verify_publication.py $repo $version

        $init = (Resolve-Path ci/template-candidate.init.gradle).Path
        ./template-fixture/gradlew -p template-fixture -I $init "-PcandidateRepo=$repo" "-PcandidateVersion=$version" `
          verifyCandidateResolution build integrationTest artifactTest --no-build-cache --stacktrace
