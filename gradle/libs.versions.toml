[versions]
checkstyle = "14.4.0"
commandapi = "12.1.0"
findsecbugs = "1.14.0"
hibernate-validator = "9.1.6.Final"
jackson = "2.23.0"
junit = "6.1.3"
mockito = "5.24.0"
mongodb = "5.14.0"
paper = "26.3.build.253-stable"
shadow = "9.6.1"
spotbugs-annotations = "4.10.5"
spotbugs-plugin = "6.5.13"
sqlite = "3.54.1.0"

[libraries]
commandapi-paper-shade = { module = "dev.jorel:commandapi-paper-shade", version.ref = "commandapi" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernate-validator" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
