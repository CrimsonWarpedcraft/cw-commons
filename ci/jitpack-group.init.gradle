import org.gradle.api.publish.maven.MavenPublication

// Publish the same MavenPublication a second time under the group seen by JitPack consumers.
// Keep the template's coordinate-sensitive Shadow rules and the producer's POM generation intact.
allprojects { p ->
    p.pluginManager.withPlugin('maven-publish') {
        p.publishing.publications.withType(MavenPublication).configureEach {
            groupId = 'com.github.CrimsonWarpedcraft'
        }
    }
}
